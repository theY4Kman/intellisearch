name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # npm trusted publishing (OIDC)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Check tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run lint:pkg
      - name: Publish (skipped if this version is already on npm)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "intellisearch@$VERSION" version >/dev/null 2>&1; then
            echo "intellisearch@$VERSION is already published; skipping"
          else
            npm publish
          fi
